<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JobHunter Pro - 智能简历投递助手</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <style>
    :root {
      --bg-primary: #0a0e17;
      --bg-secondary: #111827;
      --bg-card: #1a2332;
      --bg-card-hover: #222d42;
      --accent-primary: #00d4aa;
      --accent-secondary: #6366f1;
      --accent-tertiary: #f59e0b;
      --text-primary: #f1f5f9;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;
      --border: #2d3a4d;
      --success: #10b981;
      --warning: #f59e0b;
      --error: #ef4444;
      --gradient-primary: linear-gradient(135deg, #00d4aa 0%, #6366f1 100%);
      --gradient-bg: linear-gradient(180deg, #0a0e17 0%, #111827 100%);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--gradient-bg);
      color: var(--text-primary);
      min-height: 100vh;
      overflow-x: hidden;
    }

    .container { max-width: 1400px; margin: 0 auto; padding: 0 24px; }

    header {
      background: rgba(17, 24, 39, 0.8);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 100;
      padding: 16px 0;
    }

    .header-content { display: flex; justify-content: space-between; align-items: center; }

    .logo { display: flex; align-items: center; gap: 12px; }

    .logo-icon {
      width: 40px; height: 40px;
      background: var(--gradient-primary);
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 20px;
    }

    .logo-text {
      font-family: 'JetBrains Mono', monospace;
      font-size: 20px; font-weight: 700;
      background: var(--gradient-primary);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .header-actions { display: flex; gap: 12px; align-items: center; }

    .login-status {
      display: flex; align-items: center; gap: 8px;
      padding: 8px 16px;
      background: var(--bg-card);
      border-radius: 20px;
      font-size: 13px;
    }

    .status-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
    }

    .status-dot.connected { background: var(--success); animation: pulse 2s infinite; }
    .status-dot.disconnected { background: var(--error); }

    .header-btn {
      padding: 8px 20px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 20px;
      font-size: 13px;
      color: var(--text-primary);
      cursor: pointer;
      transition: all 0.2s;
    }

    .header-btn:hover {
      border-color: var(--accent-primary);
      background: rgba(0, 212, 170, 0.1);
    }

    .header-btn.primary {
      background: var(--gradient-primary);
      border: none;
      color: var(--bg-primary);
      font-weight: 600;
    }

    .header-btn.primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 15px rgba(0, 212, 170, 0.3);
    }

    .header-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(1.2); }
    }

    .hero { padding: 60px 0 40px; text-align: center; position: relative; }

    .hero::before {
      content: '';
      position: absolute; top: 0; left: 50%; transform: translateX(-50%);
      width: 800px; height: 300px;
      background: radial-gradient(ellipse at center, rgba(0, 212, 170, 0.15) 0%, transparent 70%);
      pointer-events: none;
    }

    .hero h1 { font-size: 42px; font-weight: 700; margin-bottom: 12px; position: relative; }

    .hero h1 span {
      background: var(--gradient-primary);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .hero p { font-size: 16px; color: var(--text-secondary); margin-bottom: 32px; }

    .control-panel {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 32px;
    }

    .control-row {
      display: flex;
      gap: 16px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }

    .control-row:last-child { margin-bottom: 0; }

    .input-group {
      flex: 1;
      min-width: 200px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .input-group label {
      font-size: 13px;
      color: var(--text-secondary);
      font-weight: 500;
    }

    .input-group input {
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 16px;
      font-size: 14px;
      color: var(--text-primary);
      outline: none;
      transition: all 0.2s;
    }

    .input-group input:focus {
      border-color: var(--accent-primary);
      box-shadow: 0 0 0 3px rgba(0, 212, 170, 0.1);
    }

    .input-group input::placeholder { color: var(--text-muted); }

    .action-buttons { display: flex; gap: 12px; align-items: flex-end; }

    .btn {
      padding: 12px 28px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      border: none;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-primary {
      background: var(--gradient-primary);
      color: var(--bg-primary);
    }

    .btn-primary:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0, 212, 170, 0.3);
    }

    .btn-danger {
      background: rgba(239, 68, 68, 0.15);
      color: var(--error);
      border: 1px solid var(--error);
    }

    .btn-secondary {
      background: var(--bg-secondary);
      color: var(--text-primary);
      border: 1px solid var(--border);
    }

    .btn-secondary:hover:not(:disabled) {
      border-color: var(--accent-primary);
      background: rgba(0, 212, 170, 0.1);
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none !important;
    }

    .progress-section {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 32px;
      display: none;
    }

    .progress-section.active { display: block; }

    .progress-header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 12px;
    }

    .progress-title { font-size: 15px; font-weight: 600; }

    .progress-meta { font-size: 13px; color: var(--text-secondary); }

    .progress-bar-container {
      height: 8px;
      background: var(--bg-secondary);
      border-radius: 4px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      background: var(--gradient-primary);
      border-radius: 4px;
      transition: width 0.3s ease;
      position: relative;
      overflow: hidden;
    }

    .progress-bar::after {
      content: '';
      position: absolute; top: 0; left: 0; right: 0; bottom: 0;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
      animation: shimmer 1.5s infinite;
    }

    @keyframes shimmer {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(100%); }
    }

    .dashboard { padding: 0 0 60px; }

    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 20px;
      margin-bottom: 32px;
    }

    .kpi-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px;
      position: relative;
      overflow: hidden;
      transition: all 0.3s ease;
    }

    .kpi-card:hover {
      transform: translateY(-4px);
      border-color: var(--accent-primary);
    }

    .kpi-icon {
      width: 48px; height: 48px;
      border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      font-size: 24px;
      margin-bottom: 16px;
    }

    .kpi-icon.green { background: rgba(16, 185, 129, 0.15); }
    .kpi-icon.blue { background: rgba(99, 102, 241, 0.15); }
    .kpi-icon.orange { background: rgba(245, 158, 11, 0.15); }
    .kpi-icon.purple { background: rgba(139, 92, 246, 0.15); }

    .kpi-value {
      font-family: 'JetBrains Mono', monospace;
      font-size: 32px; font-weight: 700;
      margin-bottom: 4px;
    }

    .kpi-label { font-size: 14px; color: var(--text-secondary); }

    .charts-grid {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 24px;
      margin-bottom: 32px;
    }

    .chart-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px;
    }

    .chart-header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 20px;
    }

    .chart-title { font-size: 16px; font-weight: 600; }

    .chart-container { position: relative; height: 280px; }

    .jobs-section {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 32px;
    }

    .section-header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 20px;
    }

    .job-list { display: flex; flex-direction: column; gap: 12px; }

    .job-item {
      display: grid;
      grid-template-columns: 1fr 120px 100px 100px;
      gap: 16px;
      padding: 16px;
      background: var(--bg-secondary);
      border-radius: 12px;
      align-items: center;
      transition: all 0.2s ease;
    }

    .job-item:hover { background: var(--bg-card-hover); }

    .job-info h4 { font-size: 15px; font-weight: 600; margin-bottom: 4px; }
    .job-info p { font-size: 13px; color: var(--text-secondary); }

    .job-salary {
      font-family: 'JetBrains Mono', monospace;
      font-weight: 600;
      color: var(--success);
    }

    .job-status {
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 500;
      text-align: center;
    }

    .job-status.success { background: rgba(16, 185, 129, 0.15); color: var(--success); }
    .job-status.viewed { background: rgba(245, 158, 11, 0.15); color: var(--warning); }
    .job-status.interview { background: rgba(99, 102, 241, 0.15); color: var(--accent-secondary); }
    .job-status.rejected { background: rgba(239, 68, 68, 0.15); color: var(--error); }
    .job-status.pending { background: rgba(100, 116, 139, 0.15); color: var(--text-muted); }

    .job-time { font-size: 12px; color: var(--text-muted); }

    .logs-section {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px;
    }

    .log-list {
      max-height: 250px;
      overflow-y: auto;
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
    }

    .log-entry {
      display: flex; gap: 12px;
      padding: 8px 0;
      border-bottom: 1px solid var(--border);
    }

    .log-entry:last-child { border-bottom: none; }
    .log-time { color: var(--text-muted); white-space: nowrap; }
    .log-message { flex: 1; }
    .log-entry.info .log-message { color: var(--text-secondary); }
    .log-entry.success .log-message { color: var(--success); }
    .log-entry.warning .log-message { color: var(--warning); }
    .log-entry.error .log-message { color: var(--error); }

    .modal-overlay {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.7);
      display: flex; align-items: center; justify-content: center;
      z-index: 1000;
      opacity: 0;
      visibility: hidden;
      transition: all 0.3s;
    }

    .modal-overlay.active {
      opacity: 1;
      visibility: visible;
    }

    .modal {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 32px;
      max-width: 420px;
      width: 90%;
      transform: translateY(20px);
      transition: transform 0.3s;
    }

    .modal-overlay.active .modal {
      transform: translateY(0);
    }

    .modal h3 {
      font-size: 20px;
      margin-bottom: 8px;
    }

    .modal p {
      font-size: 14px;
      color: var(--text-secondary);
      margin-bottom: 24px;
    }

    .modal-form {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .modal-input {
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px 16px;
      font-size: 14px;
      color: var(--text-primary);
      outline: none;
    }

    .modal-input:focus {
      border-color: var(--accent-primary);
    }

    .modal-actions {
      display: flex;
      gap: 12px;
      margin-top: 8px;
    }

    .modal-actions .btn {
      flex: 1;
      justify-content: center;
    }

    footer {
      text-align: center;
      padding: 40px 0;
      border-top: 1px solid var(--border);
      color: var(--text-muted);
      font-size: 13px;
    }

    @media (max-width: 1024px) {
      .kpi-grid { grid-template-columns: repeat(2, 1fr); }
      .charts-grid { grid-template-columns: 1fr; }
    }

    @media (max-width: 768px) {
      .hero h1 { font-size: 28px; }
      .kpi-grid { grid-template-columns: 1fr; }
      .job-item { grid-template-columns: 1fr; gap: 8px; }
      .control-row { flex-direction: column; }
      .action-buttons { flex-direction: column; width: 100%; }
      .action-buttons .btn { width: 100%; justify-content: center; }
    }
  </style>
</head>
<body>
  <header>
    <div class="container header-content">
      <div class="logo">
        <div class="logo-icon">🚀</div>
        <span class="logo-text">JobHunter Pro</span>
      </div>
      <div class="header-actions">
        <div class="login-status">
          <span class="status-dot" id="wsStatus"></span>
          <span id="loginStatusText">未连接</span>
        </div>
        <button class="header-btn" id="loginBtn">登录 Boss</button>
        <button class="header-btn primary" id="startBtn" disabled>开始投递</button>
      </div>
    </div>
  </header>

  <section class="hero">
    <div class="container">
      <h1>智能简历<span>投递助手</span></h1>
      <p>自动化求职流程，精准匹配职位，数据驱动决策</p>

      <div class="control-panel">
        <div class="control-row">
          <div class="input-group">
            <label>职位关键词</label>
            <input type="text" id="keywordInput" placeholder="如：Java AI应用开发" value="Java AI应用开发" />
          </div>
          <div class="input-group">
            <label>工作城市</label>
            <input type="text" id="cityInput" placeholder="如：北京" value="北京" />
          </div>
          <div class="input-group">
            <label>投递数量</label>
            <input type="number" id="limitInput" placeholder="投递数量" value="20" min="1" max="100" />
          </div>
        </div>
        <div class="control-row">
          <div class="action-buttons">
            <button class="btn btn-primary" id="searchJobsBtn">
              <span>🔍</span>搜索职位
            </button>
            <button class="btn btn-secondary" id="openAllBtn" disabled>
              <span>🌐</span>一键多开 (0)
            </button>
            <button class="btn btn-secondary" id="demoBtn">
              <span>📊</span>演示模式
            </button>
          </div>
        </div>
      </div>
    </div>
  </section>

  <section class="dashboard" id="searchResultsSection" style="display: none;">
    <div class="container">
      <div class="section-header" style="margin-bottom: 20px;">
        <span class="chart-title">🔍 搜索结果</span>
        <div style="display: flex; gap: 12px; align-items: center;">
          <label style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
            <input type="checkbox" id="selectAllJobs" style="width: 18px; height: 18px;">
            <span style="font-size: 14px;">全选</span>
          </label>
          <span style="font-size: 14px; color: var(--text-secondary);">
            已选择 <span id="selectedCount">0</span> 个职位
          </span>
        </div>
      </div>
      <div class="job-list" id="searchResultsList">
        <div style="text-align: center; padding: 40px; color: var(--text-muted);">
          搜索职位后显示在这里
        </div>
      </div>
    </div>
  </section>

  <section class="dashboard">
    <div class="container">
      <div class="progress-section" id="progressSection">
        <div class="progress-header">
          <span class="progress-title" id="progressTitle">正在投递...</span>
          <span class="progress-meta" id="progressMeta">0 / 0</span>
        </div>
        <div class="progress-bar-container">
          <div class="progress-bar" id="progressBar" style="width: 0%"></div>
        </div>
      </div>

      <div class="kpi-grid">
        <div class="kpi-card">
          <div class="kpi-icon green">📮</div>
          <div class="kpi-value" id="kpiTotal">0</div>
          <div class="kpi-label">总投递数</div>
        </div>
        <div class="kpi-card">
          <div class="kpi-icon blue">👁️</div>
          <div class="kpi-value" id="kpiViewed">0%</div>
          <div class="kpi-label">简历浏览率</div>
        </div>
        <div class="kpi-card">
          <div class="kpi-icon orange">🎯</div>
          <div class="kpi-value" id="kpiInterview">0</div>
          <div class="kpi-label">面试机会</div>
        </div>
        <div class="kpi-card">
          <div class="kpi-icon purple">💰</div>
          <div class="kpi-value" id="kpiSalary">0K</div>
          <div class="kpi-label">平均期望薪资</div>
        </div>
      </div>

      <div class="charts-grid">
        <div class="chart-card">
          <div class="chart-header">
            <span class="chart-title">📈 投递趋势</span>
          </div>
          <div class="chart-container">
            <canvas id="trendChart"></canvas>
          </div>
        </div>
        <div class="chart-card">
          <div class="chart-header">
            <span class="chart-title">💼 热门技能</span>
          </div>
          <div class="chart-container">
            <canvas id="skillChart"></canvas>
          </div>
        </div>
      </div>

      <div class="charts-grid">
        <div class="chart-card">
          <div class="chart-header">
            <span class="chart-title">🏢 公司分布</span>
          </div>
          <div class="chart-container">
            <canvas id="companyChart"></canvas>
          </div>
        </div>
        <div class="chart-card">
          <div class="chart-header">
            <span class="chart-title">💵 薪资分布</span>
          </div>
          <div class="chart-container">
            <canvas id="salaryChart"></canvas>
          </div>
        </div>
      </div>

      <div class="jobs-section">
        <div class="section-header">
          <span class="chart-title">📋 投递记录</span>
        </div>
        <div class="job-list" id="jobList">
          <div style="text-align: center; padding: 40px; color: var(--text-muted);">
            暂无投递记录
          </div>
        </div>
      </div>

      <div class="logs-section">
        <div class="section-header">
          <span class="chart-title">📝 实时日志</span>
          <button class="header-btn" id="clearLogsBtn" style="padding: 4px 12px;">清空</button>
        </div>
        <div class="log-list" id="logList"></div>
      </div>
    </div>
  </section>

  <div class="modal-overlay" id="loginModal">
    <div class="modal">
      <h3>登录 Boss 直聘</h3>
      <p>请输入您的 Boss 直聘账号信息</p>
      <form class="modal-form" id="loginForm">
        <input type="tel" class="modal-input" id="phoneInput" placeholder="手机号" maxlength="11" required />
        <input type="password" class="modal-input" id="passwordInput" placeholder="密码" required />
        <div class="modal-actions">
          <button type="button" class="btn btn-secondary" id="cancelLoginBtn">取消</button>
          <button type="submit" class="btn btn-primary">登录</button>
        </div>
      </form>
    </div>
  </div>

  <footer>
    <div class="container">
      <p>JobHunter Pro - 仅供学习与演示目的使用 | 请遵守目标网站服务条款</p>
    </div>
  </footer>

  <script>
    const API_BASE = '';
    let ws = null;
    let isLoggedIn = false;
    let isRunning = false;
    let applications = [];
    let searchResults = [];
    let selectedJobs = new Set();
    let charts = {};
    let wsReconnectScheduled = false;

    const demoStats = {
      kpis: {
        totalApplied: 47,
        responseRate: 0.723,
        interviewRate: 0.149,
        averageSalary: 42500
      },
      charts: {
        applicationTrend: [
          { label: '1/8', count: 5 },
          { label: '1/9', count: 8 },
          { label: '1/10', count: 6 },
          { label: '1/11', count: 9 },
          { label: '1/12', count: 7 },
          { label: '1/13', count: 6 },
          { label: '1/14', count: 6 }
        ],
        skillDemand: [
          { name: 'React', count: 85 },
          { name: 'JavaScript', count: 92 },
          { name: 'Vue', count: 72 },
          { name: 'TypeScript', count: 68 },
          { name: 'CSS3', count: 78 },
          { name: 'Node.js', count: 45 },
          { name: 'Webpack', count: 35 },
          { name: '性能优化', count: 42 }
        ],
        companyDistribution: [
          { name: '字节跳动', count: 12 },
          { name: '阿里巴巴', count: 10 },
          { name: '腾讯', count: 8 },
          { name: '美团', count: 7 },
          { name: '快手', count: 6 },
          { name: '京东', count: 5 }
        ],
        salaryDistribution: [
          { range: '<10K', count: 5 },
          { range: '10-15K', count: 12 },
          { range: '15-20K', count: 25 },
          { range: '20-25K', count: 35 },
          { range: '25-30K', count: 28 },
          { range: '30-40K', count: 32 }
        ]
      }
    };

    function connectWebSocket() {
      const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
      ws = new WebSocket(`${protocol}//${window.location.host}`);

      ws.onopen = () => {
        console.log('[WS] Connected');
        document.getElementById('wsStatus').className = 'status-dot connected';
        document.getElementById('loginStatusText').textContent = '已连接';
        checkLoginStatus();
      };

      ws.onclose = () => {
        console.log('[WS] Disconnected');
        document.getElementById('wsStatus').className = 'status-dot disconnected';
        document.getElementById('loginStatusText').textContent = '未连接';
        ws = null;
        if (!wsReconnectScheduled) {
          wsReconnectScheduled = true;
          setTimeout(() => {
            wsReconnectScheduled = false;
            connectWebSocket();
          }, 3000);
        }
      };

      ws.onerror = (error) => {
        console.error('[WS] Error:', error);
      };

      ws.onmessage = (event) => {
        const msg = JSON.parse(event.data);
        handleWebSocketMessage(msg);
      };
    }

    function handleWebSocketMessage(msg) {
      switch (msg.type) {
        case 'progress':
          updateProgressFromServer(msg.data);
          break;
        case 'log':
          addLog(msg.data.level || 'info', msg.data.message);
          break;
        case 'stats':
          updateKPIsFromServer(msg.data);
          break;
      }
    }

    function updateProgressFromServer(data) {
      const section = document.getElementById('progressSection');
      section.classList.add('active');

      const current = data.current || 0;
      const total = data.total || 1;
      const percent = (current / total) * 100;

      document.getElementById('progressBar').style.width = percent + '%';
      document.getElementById('progressMeta').textContent = `${current} / ${total}`;

      if (data.job) {
        document.getElementById('progressTitle').textContent = `正在投递: ${data.job}`;
      }

      if (data.status === 'completed' || data.status === 'done') {
        setTimeout(() => {
          section.classList.remove('active');
          isRunning = false;
          updateStartButton();
        }, 2000);
      }
    }

    function updateKPIsFromServer(stats) {
      document.getElementById('kpiTotal').textContent = stats.totalApplied || 0;
      document.getElementById('kpiViewed').textContent = ((stats.responseRate || 0) * 100).toFixed(0) + '%';
      document.getElementById('kpiInterview').textContent = stats.interviews || 0;
      document.getElementById('kpiSalary').textContent = ((stats.averageSalary || 0) / 1000).toFixed(0) + 'K';
    }

    async function checkLoginStatus() {
      try {
        const res = await fetch(`${API_BASE}/api/login/status`);
        const data = await res.json();
        updateLoginUI(data.loggedIn);
      } catch (e) {
        updateLoginUI(false);
      }
    }

    function updateLoginUI(loggedIn) {
      isLoggedIn = loggedIn;
      const loginBtn = document.getElementById('loginBtn');
      const startBtn = document.getElementById('startBtn');
      const statusText = document.getElementById('loginStatusText');

      if (loggedIn) {
        loginBtn.textContent = '已登录 ✓';
        loginBtn.style.background = 'rgba(16, 185, 129, 0.15)';
        loginBtn.style.borderColor = 'var(--success)';
        loginBtn.style.color = 'var(--success)';
        startBtn.disabled = false;
        statusText.textContent = '已登录';
      } else {
        loginBtn.textContent = '登录 Boss';
        loginBtn.style.background = '';
        loginBtn.style.borderColor = '';
        loginBtn.style.color = '';
        startBtn.disabled = true;
        statusText.textContent = '未登录';
      }
    }

    async function handleLogin(phone, password) {
      try {
        addLog('info', `正在登录账号: ${phone.slice(0, 3)}****`);

        const res = await fetch(`${API_BASE}/api/login/start`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ phone, password })
        });

        const data = await res.json();

        if (data.success) {
          addLog('success', '登录成功！Cookie 已保存');

          await fetch(`${API_BASE}/api/login/save`, { method: 'POST' });
          updateLoginUI(true);
        } else {
          addLog('error', `登录失败: ${data.error}`);
        }
      } catch (e) {
        addLog('error', `登录请求失败: ${e.message}`);
      }
    }

    async function startApply() {
      const keyword = document.getElementById('keywordInput').value.trim() || 'Java AI应用开发';
      const city = document.getElementById('cityInput').value.trim() || '北京';
      const limit = parseInt(document.getElementById('limitInput').value) || 20;

      try {
        addLog('info', `开始投递: ${keyword} @ ${city}`);

        const res = await fetch(`${API_BASE}/api/apply/start`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ keyword, city, limit })
        });

        const data = await res.json();

        if (data.success) {
          isRunning = true;
          updateStartButton();
          addLog('success', '投递任务已启动');
        } else if (data.needLogin) {
          addLog('warning', '请先登录 Boss 直聘');
          document.getElementById('loginModal').classList.add('active');
        } else {
          addLog('error', `投递失败: ${data.error}`);
        }
      } catch (e) {
        addLog('error', `请求失败: ${e.message}`);
      }
    }

    async function stopApply() {
      try {
        await fetch(`${API_BASE}/api/apply/stop`, { method: 'POST' });
        isRunning = false;
        updateStartButton();
        addLog('warning', '投递已停止');
        document.getElementById('progressSection').classList.remove('active');
      } catch (e) {
        addLog('error', `停止失败: ${e.message}`);
      }
    }

    function updateStartButton() {
      const startBtn = document.getElementById('startBtn');
      if (isRunning) {
        startBtn.innerHTML = '<span>⏹</span>停止投递';
        startBtn.onclick = stopApply;
      } else {
        startBtn.innerHTML = '<span>🚀</span>开始投递';
        startBtn.onclick = startApply;
      }
    }

    function addLog(level, message) {
      const container = document.getElementById('logList');
      const entry = document.createElement('div');
      entry.className = `log-entry ${level}`;
      entry.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
      container.insertBefore(entry, container.firstChild);

      if (container.children.length > 100) {
        container.removeChild(container.lastChild);
      }
    }

    async function searchJobs() {
      const keyword = document.getElementById('keywordInput').value.trim();
      const city = document.getElementById('cityInput').value.trim();

      if (!keyword) {
        addLog('warning', '请输入职位关键词');
        return;
      }

      addLog('info', `正在搜索: ${keyword} @ ${city}`);
      const searchBtn = document.getElementById('searchJobsBtn');
      searchBtn.disabled = true;
      searchBtn.innerHTML = '<span>⏳</span>搜索中...';

      try {
        const response = await fetch(`${API_BASE}/api/jobs/search?keyword=${encodeURIComponent(keyword)}&city=${encodeURIComponent(city)}`);

        if (!response.ok) {
          throw new Error('搜索请求失败');
        }

        const data = await response.json();

        if (data.success && data.jobs && data.jobs.length > 0) {
          searchResults = data.jobs;
          selectedJobs.clear();
          renderSearchResults();
          document.getElementById('searchResultsSection').style.display = 'block';
          document.getElementById('openAllBtn').disabled = false;
          updateSelectedCount();
          addLog('success', `找到 ${searchResults.length} 个职位`);
        } else {
          searchResults = [];
          renderSearchResults();
          addLog('warning', '未找到相关职位');
        }
      } catch (error) {
        addLog('error', `搜索失败: ${error.message}`);
        console.error('Search error:', error);
      } finally {
        searchBtn.disabled = false;
        searchBtn.innerHTML = '<span>🔍</span>搜索职位';
      }
    }

    function renderSearchResults() {
      const container = document.getElementById('searchResultsList');

      if (searchResults.length === 0) {
        container.innerHTML = '<div style="text-align: center; padding: 40px; color: var(--text-muted);">暂无搜索结果</div>';
        return;
      }

      container.innerHTML = searchResults.map((job, index) => `
        <div class="search-result-item" data-index="${index}" style="
          background: var(--bg-card);
          border: 1px solid var(--border);
          border-radius: 12px;
          padding: 20px;
          margin-bottom: 12px;
          cursor: pointer;
          transition: all 0.2s;
          display: flex;
          gap: 16px;
          align-items: flex-start;
        ">
          <input type="checkbox" class="job-checkbox" data-index="${index}" style="
            width: 20px;
            height: 20px;
            margin-top: 4px;
            cursor: pointer;
          " />
          <div style="flex: 1;">
            <div style="display: flex; justify-content: space-between; align-items: start; margin-bottom: 8px;">
              <h3 style="font-size: 16px; font-weight: 600; color: var(--text-primary); margin: 0;">${job.title}</h3>
              <span style="color: var(--accent-primary); font-weight: 600; font-size: 15px;">${job.salary?.raw || '薪资面议'}</span>
            </div>
            <div style="color: var(--text-secondary); font-size: 14px; margin-bottom: 8px;">
              ${job.company} · ${job.location}
            </div>
            <div style="display: flex; gap: 8px; flex-wrap: wrap;">
              ${(job.tags || []).slice(0, 4).map(tag => `
                <span style="
                  background: rgba(0, 212, 170, 0.1);
                  color: var(--accent-primary);
                  padding: 4px 12px;
                  border-radius: 20px;
                  font-size: 12px;
                ">${tag}</span>
              `).join('')}
            </div>
            <div style="margin-top: 12px; display: flex; gap: 12px;">
              <button class="open-single-btn" data-index="${index}" style="
                background: var(--bg-secondary);
                color: var(--text-primary);
                border: 1px solid var(--border);
                padding: 6px 16px;
                border-radius: 6px;
                cursor: pointer;
                font-size: 13px;
                transition: all 0.2s;
              " onmouseover="this.style.borderColor='var(--accent-primary)'" onmouseout="this.style.borderColor='var(--border)'">
                🌐 打开
              </button>
            </div>
          </div>
        </div>
      `).join('');

      document.querySelectorAll('.job-checkbox').forEach(checkbox => {
        checkbox.addEventListener('change', (e) => {
          const index = parseInt(e.target.dataset.index);
          toggleJobSelection(index, e.target.checked);
        });
      });

      document.querySelectorAll('.open-single-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          const index = parseInt(btn.dataset.index);
          openSingleJob(index);
        });
      });

      document.querySelectorAll('.search-result-item').forEach(item => {
        item.addEventListener('click', (e) => {
          if (e.target.type !== 'checkbox') {
            const checkbox = item.querySelector('.job-checkbox');
            checkbox.checked = !checkbox.checked;
            const index = parseInt(item.dataset.index);
            toggleJobSelection(index, checkbox.checked);
          }
        });
      });
    }

    function toggleJobSelection(index, selected) {
      if (selected) {
        selectedJobs.add(index);
      } else {
        selectedJobs.delete(index);
      }
      updateSelectedCount();
      updateOpenAllButton();
    }

    function selectAllJobs() {
      searchResults.forEach((_, index) => selectedJobs.add(index));
      document.querySelectorAll('.job-checkbox').forEach(cb => cb.checked = true);
      updateSelectedCount();
      updateOpenAllButton();
    }

    function deselectAllJobs() {
      selectedJobs.clear();
      document.querySelectorAll('.job-checkbox').forEach(cb => cb.checked = false);
      updateSelectedCount();
      updateOpenAllButton();
    }

    function updateSelectedCount() {
      document.getElementById('selectedCount').textContent = selectedJobs.size;
    }

    function updateOpenAllButton() {
      const btn = document.getElementById('openAllBtn');
      btn.innerHTML = `<span>🌐</span>一键多开 (${selectedJobs.size})`;
      btn.disabled = selectedJobs.size === 0;
    }

    function openSingleJob(index) {
      const job = searchResults[index];
      if (job && job.url) {
        window.open(job.url, '_blank');
        addLog('info', `打开职位: ${job.title}`);
      }
    }

    function openSelectedJobs() {
      if (selectedJobs.size === 0) {
        addLog('warning', '请先选择要打开的职位');
        return;
      }

      addLog('info', `正在打开 ${selectedJobs.size} 个职位...`);

      const jobsToOpen = Array.from(selectedJobs).map(index => searchResults[index]);

      jobsToOpen.forEach((job, index) => {
        setTimeout(() => {
          if (job.url) {
            window.open(job.url, '_blank');
            addLog('success', `✓ 已打开: ${job.title}`);
          }
        }, index * 300);
      });

      setTimeout(() => {
        addLog('info', `已完成打开 ${jobsToOpen.length} 个职位页面`);
      }, jobsToOpen.length * 300 + 500);
    }

    function initCharts() {
      const defaults = {
        responsive: true,
        maintainAspectRatio: false,
        plugins: { legend: { display: false } }
      };

      charts.trend = new Chart(document.getElementById('trendChart'), {
        type: 'line',
        data: {
          labels: [],
          datasets: [{
            data: [],
            borderColor: '#00d4aa',
            backgroundColor: 'rgba(0, 212, 170, 0.1)',
            fill: true,
            tension: 0.4
          }]
        },
        options: {
          ...defaults,
          scales: {
            x: { grid: { color: 'rgba(255,255,255,0.05)' }, ticks: { color: '#94a3b8' } },
            y: { grid: { color: 'rgba(255,255,255,0.05)' }, ticks: { color: '#94a3b8' } }
          }
        }
      });

      charts.skill = new Chart(document.getElementById('skillChart'), {
        type: 'bar',
        data: {
          labels: [],
          datasets: [{
            data: [],
            backgroundColor: ['#00d4aa', '#6366f1', '#f59e0b', '#10b981', '#8b5cf6', '#ec4899', '#14b8a6', '#f97316']
          }]
        },
        options: { ...defaults, indexAxis: 'y', scales: { x: { grid: { color: 'rgba(255,255,255,0.05)' }, ticks: { color: '#94a3b8' } }, y: { grid: { display: false }, ticks: { color: '#94a3b8' } } } }
      });

      charts.company = new Chart(document.getElementById('companyChart'), {
        type: 'doughnut',
        data: {
          labels: [],
          datasets: [{ data: [], backgroundColor: ['#00d4aa', '#6366f1', '#f59e0b', '#10b981', '#8b5cf6', '#ec4899'] }]
        },
        options: { ...defaults, cutout: '65%', plugins: { legend: { display: true, position: 'right', labels: { color: '#94a3b8' } } } }
      });

      charts.salary = new Chart(document.getElementById('salaryChart'), {
        type: 'bar',
        data: {
          labels: [],
          datasets: [{ data: [], backgroundColor: 'rgba(99, 102, 241, 0.1)', borderColor: '#6366f1', borderWidth: 2 }]
        },
        options: { ...defaults, scales: { x: { grid: { display: false }, ticks: { color: '#94a3b8' } }, y: { grid: { color: 'rgba(255,255,255,0.05)' }, ticks: { color: '#94a3b8' } } } }
      });

      updateCharts(demoStats);
    }

    function updateCharts(stats) {
      const d = stats.charts;

      charts.trend.data.labels = d.applicationTrend.map(x => x.label);
      charts.trend.data.datasets[0].data = d.applicationTrend.map(x => x.count);
      charts.trend.update();

      charts.skill.data.labels = d.skillDemand.slice(0, 6).map(x => x.name);
      charts.skill.data.datasets[0].data = d.skillDemand.slice(0, 6).map(x => x.count);
      charts.skill.update();

      charts.company.data.labels = d.companyDistribution.map(x => x.name);
      charts.company.data.datasets[0].data = d.companyDistribution.map(x => x.count);
      charts.company.update();

      charts.salary.data.labels = d.salaryDistribution.map(x => x.range);
      charts.salary.data.datasets[0].data = d.salaryDistribution.map(x => x.count);
      charts.salary.update();

      const k = stats.kpis;
      document.getElementById('kpiTotal').textContent = k.totalApplied;
      document.getElementById('kpiViewed').textContent = (k.responseRate * 100).toFixed(0) + '%';
      document.getElementById('kpiInterview').textContent = Math.round(k.interviewRate * k.totalApplied);
      document.getElementById('kpiSalary').textContent = (k.averageSalary / 1000).toFixed(0) + 'K';
    }

    function renderJobs() {
      const container = document.getElementById('jobList');

      if (applications.length === 0) {
        container.innerHTML = '<div style="text-align: center; padding: 40px; color: var(--text-muted);">暂无投递记录</div>';
        return;
      }

      container.innerHTML = applications.map(app => `
        <div class="job-item">
          <div class="job-info">
            <h4>${app.jobTitle || app.title || '未知职位'}</h4>
            <p>${app.company || '未知公司'}</p>
          </div>
          <div class="job-salary">${app.salary || '-'}</div>
          <div><span class="job-status ${app.status || 'pending'}">${getStatusText(app.status)}</span></div>
          <div class="job-time">${formatTime(app.appliedAt || app.time)}</div>
        </div>
      `).join('');
    }

    function getStatusText(status) {
      const map = { success: '已投递', viewed: '已查看', interview: '面试中', rejected: '不合适', pending: '待投递', failed: '失败' };
      return map[status] || status;
    }

    function formatTime(isoString) {
      if (!isoString) return '-';
      const date = new Date(isoString);
      const now = new Date();
      const diff = Math.floor((now - date) / 1000);
      if (diff < 60) return '刚刚';
      if (diff < 3600) return Math.floor(diff / 60) + '分钟前';
      if (diff < 86400) return Math.floor(diff / 3600) + '小时前';
      return Math.floor(diff / 86400) + '天前';
    }

    function runDemo() {
      addLog('info', '启动演示模式...');

      const keyword = document.getElementById('keywordInput').value.trim() || 'Java AI应用开发';
      const section = document.getElementById('progressSection');
      section.classList.add('active');

      const demoJobs = [
        { title: 'Java 高级开发工程师', company: '字节跳动', salary: '35K-60K' },
        { title: 'Java 开发工程师', company: '阿里巴巴', salary: '30K-50K' },
        { title: '后端开发工程师', company: '腾讯', salary: '40K-70K' },
        { title: 'Java 技术专家', company: '美团', salary: '45K-80K' },
        { title: 'AI 应用开发工程师', company: '快手', salary: '35K-55K' }
      ];

      let index = 0;
      const total = demoJobs.length;

      function processNext() {
        if (index >= total) {
          document.getElementById('progressBar').style.width = '100%';
          document.getElementById('progressMeta').textContent = `${total} / ${total}`;
          document.getElementById('progressTitle').textContent = '投递完成';

          addLog('success', `演示完成：成功投递 ${total} 个职位`);

          demoJobs.forEach(job => {
            applications.unshift({
              ...job,
              status: 'success',
              appliedAt: new Date().toISOString()
            });
          });

          renderJobs();

          setTimeout(() => {
            section.classList.remove('active');
            document.getElementById('progressTitle').textContent = '正在投递...';
          }, 2000);
          return;
        }

        const job = demoJobs[index];
        const percent = (index / total) * 100;

        document.getElementById('progressBar').style.width = percent + '%';
        document.getElementById('progressMeta').textContent = `${index + 1} / ${total}`;
        document.getElementById('progressTitle').textContent = `正在投递: ${job.title}`;

        addLog('info', `投递: ${job.title} @ ${job.company}`);

        setTimeout(() => {
          addLog('success', `✓ 投递成功: ${job.title}`);
          index++;
          processNext();
        }, 800 + Math.random() * 1200);
      }

      processNext();
    }

    function init() {
      initCharts();
      updateLoginUI(false);
      updateStartButton();

      addLog('info', '系统就绪');
      addLog('info', '请先登录 Boss 直聘以开始自动投递');
      addLog('info', '或点击"演示模式"体验功能');

      document.getElementById('loginBtn').addEventListener('click', () => {
        document.getElementById('loginModal').classList.add('active');
      });

      document.getElementById('cancelLoginBtn').addEventListener('click', () => {
        document.getElementById('loginModal').classList.remove('active');
      });

      document.getElementById('loginModal').addEventListener('click', (e) => {
        if (e.target.id === 'loginModal') {
          document.getElementById('loginModal').classList.remove('active');
        }
      });

      document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const phone = document.getElementById('phoneInput').value.trim();
        const password = document.getElementById('passwordInput').value;

        if (!/^1[3-9]\d{9}$/.test(phone)) {
          addLog('error', '请输入正确的手机号');
          return;
        }

        await handleLogin(phone, password);
        document.getElementById('loginModal').classList.remove('active');
        document.getElementById('passwordInput').value = '';
      });

      document.getElementById('startBtn').addEventListener('click', startApply);

      document.getElementById('demoBtn').addEventListener('click', runDemo);

      document.getElementById('searchJobsBtn').addEventListener('click', searchJobs);

      document.getElementById('openAllBtn').addEventListener('click', openSelectedJobs);

      document.getElementById('selectAllJobs').addEventListener('change', (e) => {
        if (e.target.checked) {
          selectAllJobs();
        } else {
          deselectAllJobs();
        }
      });

      document.getElementById('clearLogsBtn').addEventListener('click', () => {
        document.getElementById('logList').innerHTML = '';
        addLog('info', '日志已清空');
      });

      document.addEventListener('keydown', (e) => {
        if (e.ctrlKey || e.metaKey) {
          if (e.key === 'o' || e.key === 'O') {
            e.preventDefault();
            openSelectedJobs();
          }
          if (e.key === 'a' || e.key === 'A') {
            if (document.getElementById('searchResultsSection').style.display !== 'none') {
              e.preventDefault();
              selectAllJobs();
              document.getElementById('selectAllJobs').checked = true;
            }
          }
        }
      });

      connectWebSocket();
    }

    document.addEventListener('DOMContentLoaded', init);
  </script>
